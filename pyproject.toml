[project]
name = "riggers-mortise"
version = "0.6.0"
description = "Jack into whatever LLMs are alive nearby and drive them from the CLI."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
mortise = "mortise.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mortise"]
